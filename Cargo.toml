[package]
name = "rustqc"
version = "0.4.0"
edition = "2024"
authors = ["Shakil Rafi"]
description = "Fast, memory-bounded quality control for FASTQ data"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/2shakilrafi/rustqc"
repository = "https://github.com/2shakilrafi/rustqc"
rust-version = "1.88"
keywords = ["bioinformatics", "fastq", "quality-control", "sequencing"]
categories = ["command-line-utilities", "science"]
include = [
    "src/**",
    "assets/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[dependencies]
aho-corasick = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
indicatif = "0.17"
needletail = "0.7.3"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
