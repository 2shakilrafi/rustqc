[package]
name = "rustqc"
version = "0.3.6"
edition = "2024"
authors = ["Shakil Rafi"]
description = "Fast, memory-bounded quality control for FASTQ data"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
indicatif = "0.17"
needletail = "0.7.3"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
